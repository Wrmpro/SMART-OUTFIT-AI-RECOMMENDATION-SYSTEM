<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customize Outfit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='customize.css') }}">
    <style>
        /* Loading Timer Styles */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00ffff;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .loading-timer {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }

        .progress-steps {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
            transition: all 0.3s ease;
        }

        .progress-step.active {
            color: #00ffff;
            font-weight: 600;
        }

        .progress-step.completed {
            color: #00ffd0;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: all 0.3s ease;
        }

        .progress-step.active .step-dot {
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: pulse 1s infinite;
        }

        .progress-step.completed .step-dot {
            background: #00ffd0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .loading-message {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
            max-width: 300px;
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Analyzing your style...</div>
        <div class="loading-timer" id="loadingTimer">0s</div>
        <div class="progress-steps" id="progressSteps">
            <div class="progress-step active" id="step1">
                <div class="step-dot"></div>
                <span>Detecting face</span>
            </div>
            <div class="progress-step" id="step2">
                <div class="step-dot"></div>
                <span>Analyzing skin tone</span>
            </div>
            <div class="progress-step" id="step3">
                <div class="step-dot"></div>
                <span>Finding outfits</span>
            </div>
            <div class="progress-step" id="step4">
                <div class="step-dot"></div>
                <span>Generating rationale</span>
            </div>
        </div>
        <div class="loading-message" id="loadingMessage">
            This may take a few moments...
        </div>
    </div>

    <!-- Background -->
    <video class="bg-video" autoplay muted loop>
        <source
            src="{{ url_for('static', filename='VideoVault_Stock_Video_Tailor_comes_up_with_new_models_for_the_latest_collection_2160P.webm') }}"
            type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="page-wrapper">
        <div class="card">

            <!-- Heading -->
            <h1>Customize Your Outfit</h1>
            <p class="subtitle">AI-powered fashion intelligence tailored uniquely for you</p>

            <!-- Upload -->
            <div class="upload-box" id="uploadBox">
                <input type="file" id="fileInput" hidden accept="image/*">
                <i class="fa-solid fa-camera"></i>
                <span>Upload your image</span>
            </div>

            <!-- Scan Area -->
            <div class="scan-area" id="scanArea">
                <img id="previewImage">
                <div class="scan-line"></div>
                <p>AI analyzing your appearance…</p>
            </div>

            <!-- Gender -->
            <section>
                <h3>Select Identity</h3>
                <div class="buttons" id="genderButtons">
                    <button class="btn active" data-value="women">Female</button>
                    <button class="btn" data-value="men">Male</button>
                </div>
            </section>

            <!-- Occasion -->
            <section>
                <h3>Select Occasion</h3>
                <div class="buttons" id="occasionButtons">
                    <button class="btn active">Casual</button>
                    <button class="btn">Party</button>
                    <button class="btn">Formal</button>
                    <button class="btn">Festival</button>
                </div>
            </section>

            <!-- CTA -->
            <button class="continue-btn" id="generateBtn">
                Generate AI Outfit →
            </button>

        </div>
    </div>

    <script>
        const uploadBox = document.getElementById("uploadBox");
        const fileInput = document.getElementById("fileInput");
        const scanArea = document.getElementById("scanArea");
        const previewImage = document.getElementById("previewImage");
        const generateBtn = document.getElementById("generateBtn");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingText = document.getElementById("loadingText");
        const loadingTimer = document.getElementById("loadingTimer");
        const loadingMessage = document.getElementById("loadingMessage");

        uploadBox.onclick = () => {
            fileInput.value = ""; // Clear value to allow same file re-upload
            fileInput.click();
        };

        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (file) {
                previewImage.src = URL.createObjectURL(file);
                uploadBox.style.display = "none";
                scanArea.style.display = "block";
                
                // Add a "Change Image" button if it doesn't exist
                if (!document.getElementById('changeImageBtn')) {
                    const changeBtn = document.createElement('button');
                    changeBtn.id = 'changeImageBtn';
                    changeBtn.innerText = 'Change Image';
                    changeBtn.className = 'btn';
                    changeBtn.style.marginTop = '10px';
                    changeBtn.onclick = (event) => {
                        event.stopPropagation();
                        fileInput.click();
                    };
                    scanArea.appendChild(changeBtn);
                }
            }
        };

        document.querySelectorAll(".buttons").forEach(group => {
            group.querySelectorAll(".btn").forEach(btn => {
                btn.onclick = () => {
                    group.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                };
            });
        });

        // Progress step messages
        const progressMessages = {
            'Casual': ['Detecting face', 'Analyzing skin tone', 'Finding casual outfits', 'Generating recommendations'],
            'Party': ['Detecting face', 'Analyzing skin tone', 'Curating party outfits', 'Generating AI rationale'],
            'Formal': ['Detecting face', 'Analyzing skin tone', 'Finding formal wear', 'Generating recommendations'],
            'Festival': ['Detecting face', 'Analyzing skin tone', 'Finding festival wear', 'Generating recommendations']
        };

        function updateProgressStep(stepNum, isActive = false, isCompleted = false) {
            const step = document.getElementById(`step${stepNum}`);
            if (isActive) {
                step.classList.add('active');
                step.classList.remove('completed');
            } else if (isCompleted) {
                step.classList.remove('active');
                step.classList.add('completed');
            } else {
                step.classList.remove('active', 'completed');
            }
        }

        function startLoadingAnimation(occasion) {
            loadingOverlay.classList.add('active');
            let seconds = 0;
            let currentStep = 1;

            const timerInterval = setInterval(() => {
                seconds++;
                loadingTimer.innerText = `${seconds}s`;

                // Update progress steps based on time
                if (seconds === 3 && currentStep === 1) {
                    updateProgressStep(1, false, true);
                    updateProgressStep(2, true, false);
                    currentStep = 2;
                } else if (seconds === 6 && currentStep === 2) {
                    updateProgressStep(2, false, true);
                    updateProgressStep(3, true, false);
                    currentStep = 3;
                } else if (seconds === 9 && currentStep === 3) {
                    updateProgressStep(3, false, true);
                    updateProgressStep(4, true, false);
                    currentStep = 4;
                }

                // Update loading message
                if (seconds === 2) {
                    loadingMessage.innerText = 'Scanning your facial features...';
                } else if (seconds === 5) {
                    loadingMessage.innerText = occasion === 'Party' ? 'Curating trendy party outfits...' : 'Finding perfect outfits for you...';
                } else if (seconds === 8) {
                    loadingMessage.innerText = 'Generating personalized AI recommendations...';
                }
            }, 1000);

            return timerInterval;
        }

        generateBtn.onclick = async () => {
            if (!fileInput.files.length) {
                alert("Please upload an image first");
                return;
            }

            const gender = document.querySelector("#genderButtons .btn.active").dataset.value;
            const occasion = document.querySelector("#occasionButtons .btn.active").innerText;

            const formData = new FormData();
            formData.append("image", fileInput.files[0]);
            formData.append("gender", gender);
            formData.append("occasion", occasion);

            generateBtn.innerText = "Processing AI…";
            generateBtn.disabled = true;

            // Start loading animation
            const timerInterval = startLoadingAnimation(occasion);

            try {
                const res = await fetch("/analyze", {
                    method: "POST",
                    body: formData
                });

                if (!res.ok) {
                    throw new Error(`Server error: ${res.status}`);
                }

                const data = await res.json();
                
                // Verify data has outfits
                if (!data.outfits || data.outfits.length === 0) {
                    throw new Error("No outfits returned");
                }

                // Store in session
                sessionStorage.setItem("ai_result", JSON.stringify(data));
                
                clearInterval(timerInterval);
                
                // Show completion
                updateProgressStep(4, false, true);
                loadingText.innerText = '✓ Outfits ready!';
                loadingMessage.innerText = 'Redirecting to your personalized recommendations...';
                
                // Wait 1.5 seconds then redirect
                setTimeout(() => {
                    window.location.href = "/results";
                }, 1500);
            } catch (error) {
                clearInterval(timerInterval);
                loadingOverlay.classList.remove('active');
                generateBtn.innerText = "Generate AI Outfit →";
                generateBtn.disabled = false;
                alert(`Error: ${error.message}. Please try again.`);
                console.error("Error:", error);
            }
        };
    </script>

</body>

</html>
